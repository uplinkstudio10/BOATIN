<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BOATIN</title><meta name="description" content="AI Chat + Real-Time Search"><link rel="manifest" id="pwaManifestLink" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" /><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><link rel="stylesheet" href="styles.css?v=final" /></head><body><div id="app-root"><header class="app-header"><div class="header-top"><div class="header-top-left"><h1>BOATIN</h1></div><div class="header-actions"><button class="header-btn" id="clearMemoryBtn" title="Clear chat">Clear 🗑️</button></div></div><div class="header-bar"><button class="tab-btn active" data-tab="model">🎯 Model</button><button class="tab-btn" data-tab="auto">⚙️ Auto</button><button class="tab-btn" data-tab="fallback">🔄 Fallback</button><button class="tab-btn" data-tab="actions">🚀 Actions</button></div></header><div id="messagesContainer" class="messages-container"></div><div class="chat-input-area"><div class="input-controls"><button id="attachBtn" class="icon-btn" title="Attach file">📎</button><select id="effortMode" class="effort-select"><option value="low">Low (4K)</option><option value="mid" selected>Mid (16K)</option><option value="high">High (32K)</option><option value="max">Max (65K)</option></select><button id="liveSearchBtn" class="action-btn" title="Toggle Live Search" style="display:none;">⚡ Live</button><button id="sendMessageBtn" class="send-btn">Send ➜</button></div><div id="attachmentPreviewBar" style="display:none;"><span id="attachmentNameText"></span><button id="removeFileBtn">✕</button></div><textarea id="messageTextInput" class="message-input" placeholder="Type message..." rows="3"></textarea><input id="fileInput" type="file" style="display:none;" /></div><div id="modelSelect" style="display:none;"></div><div id="autoMode" style="display:none;"></div><div id="autoCallback" style="display:none;"></div><button id="stopMessageBtn" style="display:none;"></button><div id="effortChips" style="display:none;"></div><div id="modeChips" style="display:none;"></div><div id="sessionsModal" style="display:none;"></div><div id="sessionsList" style="display:none;"></div><button id="sessionCloseBtn" style="display:none;"></button><button id="sessionNewBtn" style="display:none;"></button></div><script src="app.js?v=final" defer></script></body></html>
